name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: "Python ${{ matrix.python }}: lint, types, tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (strict)
        run: mypy
      - name: Tests
        run: pytest
      - name: Look up one customer online and offline from the CLI
        run: featurestore lookup 7 --at 80 --users 500

  evaluation:
    name: Labelled evaluation (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Consistency, leakage and skew detection, gate the result
        run: featurestore evaluate --users 2000 --gate --out "$RUNNER_TEMP/eval"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: ${{ runner.temp }}/eval

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
